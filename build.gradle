buildscript {
    ext.kotlin_version = "1.6.10"
    ext.appcompat = '1.0.2'
    ext.fragment = '1.2.5'
    ext.lifecycle = '2.2.0'
    ext.material_design = '1.1.0'
    ext.androidCoroutines = '1.3.3'

    repositories {
        google()
        mavenCentral()
        jcenter()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:4.0.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

def minSdkKotlinOde = 24
def targetSdkKotlinOde = 30
def versionCodeKotlinOde = 1
def versionNameKotlinOde = "0.0.1"
def groupIdKotlinOde = "br.com.lab"
def artifactIdKotlinOde = "kotlin-ode"
def compileSdkKotlinOde = 30
def buildToolsVersionKotlinOde = "30.0.0"
def projectDescriptionKotlinOde = "Opinionated Android delivery engine for Kotlin applications."
def developerIdKotlinOde = "animalab"
def developerNameKotlinOde = "ÂnimaLab"
def developerEmailKotlinOde = "animalab.desenvolvimento@gmail.com"
def organizationNameKotlinOde = "ÂnimaLab"
def organizationUrlKotlinOde = findProperty('organizationUrlKotlinOde')
def scmUrlKotlinOde = findProperty('scmUrlKotlinOde')
def scmConnectionKotlinOde = findProperty('scmConnectionKotlinOde')
def scmDeveloperConnectionKotlinOde = findProperty('scmDeveloperConnectionKotlinOde')
def licenseNameKotlinOde = "Apache License, Version 2.0"
def licenseUrlKotlinOde = "https://www.apache.org/licenses/LICENSE-2.0.txt"

group = groupIdKotlinOde
version = versionNameKotlinOde

repositories {
    google()
    mavenCentral()
    jcenter()
}

android {
    compileSdkVersion compileSdkKotlinOde
    buildToolsVersion buildToolsVersionKotlinOde

    defaultConfig {
        minSdkVersion minSdkKotlinOde
        targetSdkVersion targetSdkKotlinOde
        versionCode versionCodeKotlinOde
        versionName versionNameKotlinOde

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "proguard-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from android.sourceSets.main.java.srcDirs
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.3'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$androidCoroutines"
    api "androidx.appcompat:appcompat:$appcompat"
    api "androidx.fragment:fragment-ktx:$fragment"
    api "androidx.lifecycle:lifecycle-runtime:$lifecycle"
    api "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle"
    api "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle"
    api "com.google.android.material:material:$material_design"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.3.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.3.2"
    testImplementation "org.junit.jupiter:junit-jupiter-params:5.3.2"
    testImplementation "androidx.arch.core:core-testing:2.1.0"
    testImplementation "com.nhaarman.mockitokotlin2:mockito-kotlin:2.2.0"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.3.3'
    testImplementation "org.mockito:mockito-core:4.6.1"

    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    androidTestImplementation "org.mockito:mockito-android:4.6.1"
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = groupIdKotlinOde
            artifactId = artifactIdKotlinOde
            version = versionNameKotlinOde

            artifact androidSourcesJar

            pom {
                name = artifactIdKotlinOde
                description = projectDescriptionKotlinOde

                licenses {
                    license {
                        name = licenseNameKotlinOde
                        url = licenseUrlKotlinOde
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = developerIdKotlinOde
                        name = developerNameKotlinOde
                        email = developerEmailKotlinOde
                    }
                }

                organization {
                    name = organizationNameKotlinOde
                    if (organizationUrlKotlinOde) {
                        url = organizationUrlKotlinOde
                    }
                }

                if (scmUrlKotlinOde || scmConnectionKotlinOde || scmDeveloperConnectionKotlinOde) {
                    scm {
                        if (scmUrlKotlinOde) {
                            url = scmUrlKotlinOde
                        }
                        if (scmConnectionKotlinOde) {
                            connection = scmConnectionKotlinOde
                        }
                        if (scmDeveloperConnectionKotlinOde) {
                            developerConnection = scmDeveloperConnectionKotlinOde
                        }
                    }
                }
            }

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        mavenLocal()
        if (project.hasProperty('urlV2Space')) {
            maven {
                url urlV2Space
                credentials {
                    username findProperty('spaceUsername')
                    password findProperty('spacePassword')
                }
            }
        }
    }
}
